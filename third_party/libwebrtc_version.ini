# libwebrtc prebuilt binary release info.
# See https://github.com/GetStream/webrtc/releases for available versions.
# `download_url` is the base release-download URL; the version tag, asset name
# and `.zip` suffix are appended at configure time by third_party/CMakeLists.txt.
#
# binary_version must point at a GetStream/webrtc release that actually has
# desktop libwebrtc assets attached (libwebrtc-{linux,win}-{x64,arm64}-release.zip),
# i.e. one built by that repo's Build/Publish workflows with desktop_linux/
# desktop_windows enabled. 145.10.0 is the current release tag but does not
# yet carry those assets -- this needs republishing/asset upload before this
# manifest resolves to a working download.
[libwebrtc]
binary_version = 145.10.0
download_url   = https://github.com/GetStream/webrtc/releases/download
